# ---------------------------------------------------------------------------
# Webware application development environment
#
# Two things live here:
#
#   1. The backing services the application talks to — MySQL, phpMyAdmin and
#      Mailpit — each published to the host, because the application's PHP runs
#      on the host and connects to them over 127.0.0.1.
#   2. The `tooling` container, which runs the full Webware toolchain (Composer,
#      PHPUnit, Mago, Infection, PHPBench, roave BC-check) for anyone who wants
#      the toolchain containerised rather than native.
#
# This compose file is the single source of truth for the environment. Two
# ways to use it:
#
#   1. VS Code Dev Container — "Reopen in Container" uses
#      .devcontainer/devcontainer.json, which is *backed by* this file (it
#      references the `tooling` service rather than defining its own).
#
#   2. Plain Docker Compose (any editor / no VS Code):
#        docker compose up -d                 # start the persistent container
#        docker compose exec tooling bash     # attach an interactive shell
#        docker compose exec tooling composer install
#        docker compose exec tooling composer test
#        docker compose exec tooling mago lint
#        docker compose down                  # stop it
#
# Services are addressed from the host on 127.0.0.1: MySQL 3306, Mailpit SMTP
# 1025 / UI 8025, phpMyAdmin 8082. That is why config/autoload/mysql.local.php
# uses host 127.0.0.1 rather than the compose service name, and why phpMyAdmin
# does not take 8080 — that port belongs to the application (`composer serve`).
# The service values mirror the `db_image` / `db_env_json` / `db_port` package
# parameters used by CI.
# ---------------------------------------------------------------------------

services:
  tooling:
    build:
      context: .
      args:
        # PHP version to base the image on (latest 8.4 patch release). Keep
        # in sync with the package's supported PHP versions and
        # `config.platform.php`.
        PHP_VERSION: "8.4.24"
    # Keep the container alive so `docker compose exec` can attach to it.
    # (VS Code Dev Containers override this with their own command.)
    command: sleep infinity
    stdin_open: true
    tty: true
    environment:
      # Point Composer at the named volume so its cache and global config
      # survive container rebuilds (and live on the fast Linux filesystem).
      COMPOSER_HOME: /tmp/composer-cache
      # Uncomment (or export in your shell) to enable step debugging:
      # XDEBUG_MODE: debug
    extra_hosts:
      # Lets Xdebug connect back to the host IDE from Windows, macOS, or Linux
      # (host-gateway resolves to the Docker host on every platform).
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount the source so edits are visible on both the host and the
      # container. vendor/ is NOT overridden — it is the host's own copy.
      # Composer/installs inside the container write straight into the
      # developer's working tree on disk.
      - .:/app
      # The Composer cache lives in a named volume (Linux-native I/O, fast on
      # Windows) so downloads survive container rebuilds. It is only a cache
      # — the developer's real artifacts all live on the host.
      - composer-cache:/tmp/composer-cache
    # MySQL must be healthy before the shell attaches (see the `mysql` service
    # below).
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app

  # -------------------------------------------------------------------------
  # MySQL — mirrors the CI `db_image` / `db_env_json` / `db_port` parameters so
  # the dev database matches CI. Reachable from `tooling` as host `mysql` on
  # port 3306, which is where config/autoload/mysql.local.php points.
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_DATABASE: webware
      MYSQL_USER: webware
      MYSQL_PASSWORD: webware
    ports:
      # Published so the database resolves from the host (127.0.0.1:3306);
      # inside the compose network it is also reachable as host `mysql`.
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      # Named volume keeps the data on the fast Linux filesystem and
      # survives `docker compose down` (use `down -v` to wipe it).
      - mysql-data:/var/lib/mysql
  # -------------------------------------------------------------------------
  # phpMyAdmin — web UI for the `mysql` service above, published on 8082 so the
  # application keeps 8080 for itself (`composer serve`). Reachable at
  # http://localhost:8082 (log in as root with an empty password, or with the
  # MYSQL_USER / MYSQL_PASSWORD credentials).
  # -------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Mailpit — catches outgoing mail for webware-mailer. Reachable from
  # `tooling` as host `mailpit` on port 1025; the web UI is at
  # http://localhost:8025.
  # -------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  composer-cache:
  mysql-data:
